name: Generate contribution snake

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: samairaxox
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C084FC&color_dots=%23ebedf0,%23e9d5ff,%23d8b4fe,%23a78bfa,%237c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F0ABFC&color_dots=%23161b22,%234b286c,%237c3aed,%23b794f4,%23e9d5ff
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
